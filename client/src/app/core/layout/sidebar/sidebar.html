<aside class="sidebar">

  <mat-nav-list>

    @for (item of navigationItems; track item.route) {

      @if (hasPermission(item.permission)) {

        <a
          mat-list-item
          [routerLink]="item.route"
          routerLinkActive="active">

          <mat-icon matListItemIcon>
            {{ item.icon }}
          </mat-icon>

          <span matListItemTitle>
            {{ item.label }}
          </span>

        </a>

      }

    }

  </mat-nav-list>

</aside>
